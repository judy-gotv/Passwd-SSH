name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            pkg: tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            pkg: zip
          - os: macos-latest
            target: aarch64-apple-darwin
            pkg: tar.gz
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked -p opsdeck --target ${{ matrix.target }}

      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          BIN="target/${{ matrix.target }}/release/opsdeck"
          STAGE="opsdeck-$VER-${{ matrix.target }}"
          mkdir -p "$STAGE"
          cp "$BIN" "$STAGE/"
          cp README.md LICENSE-MIT LICENSE-APACHE "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
          echo "ARTIFACT=$STAGE.tar.gz" >> "$GITHUB_ENV"

      - name: Debian package (linux)
        if: runner.os == 'Linux'
        run: |
          VER="${GITHUB_REF_NAME#v}"
          PKG="opsdeck_${VER}_amd64"
          mkdir -p "$PKG/DEBIAN" "$PKG/usr/bin" "$PKG/usr/share/doc/opsdeck"
          cp "target/${{ matrix.target }}/release/opsdeck" "$PKG/usr/bin/"
          cp README.md "$PKG/usr/share/doc/opsdeck/"
          cat > "$PKG/DEBIAN/control" <<EOF
          Package: opsdeck
          Version: $VER
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Passwd Word
          Description: OpsDeck - local-first SSH workstation
           Tabbed terminals, SFTP, monitoring and encrypted sync.
          EOF
          dpkg-deb --build "$PKG"
          echo "DEB=${PKG}.deb" >> "$GITHUB_ENV"

      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $VER = "${{ github.ref_name }}".TrimStart("v")
          $STAGE = "opsdeck-$VER-${{ matrix.target }}"
          New-Item -ItemType Directory -Path $STAGE | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/opsdeck.exe" "$STAGE/"
          Copy-Item README.md, LICENSE-MIT, LICENSE-APACHE $STAGE/
          Compress-Archive -Path $STAGE -DestinationPath "$STAGE.zip"
          "ARTIFACT=$STAGE.zip" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.target }}
          path: |
            ${{ env.ARTIFACT }}
            ${{ env.DEB }}

  release:
    name: publish release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        run: |
          cd dist
          sha256sum * > SHA256SUMS.txt
          ls -la

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* \
            --title "OpsDeck ${GITHUB_REF_NAME}" \
            --notes "OpsDeck ${GITHUB_REF_NAME} — see README.md for install instructions."
