name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt + clippy + test + build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux GUI deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config libssl-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev \
            libgl1-mesa-dev libegl1-mesa-dev

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Start test sshd (Linux e2e)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get install -y openssh-server
          sudo ssh-keygen -A
          sudo useradd -m -s /bin/bash testssh || true
          echo "testssh:testpass123" | sudo chpasswd
          sudo mkdir -p /run/sshd
          cat <<'EOF' | sudo tee /tmp/sshd_test_config
          Port 2222
          Protocol 2
          HostKey /etc/ssh/ssh_host_rsa_key
          HostKey /etc/ssh/ssh_host_ed25519_key
          PasswordAuthentication yes
          PubkeyAuthentication no
          UsePAM no
          PermitRootLogin no
          PidFile /tmp/sshd_test.pid
          EOF
          sudo /usr/sbin/sshd -f /tmp/sshd_test_config

      - name: test
        run: cargo test --workspace

      - name: build
        run: cargo build --release --locked -p opsdeck
